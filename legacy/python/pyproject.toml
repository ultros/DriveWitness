[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drivewitness"
version = "2.0.0"
description = "Tamper-evident filesystem evidence collector"
requires-python = ">=3.10"
dependencies = ["blake3>=1.0.0,<2", "cryptography>=43,<51", "psutil>=6,<8"]

[project.scripts]
drivewitness = "dw.cli:main"

[tool.setuptools]
packages = ["dw"]
py-modules = ["drivewitness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
